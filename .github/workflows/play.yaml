# Builds the TV app for Google Play, an app bundle signed with the private
# upload key (never the sideload key in the repo), and releases it on Google
# Play (scripts/play.py): rolled out on the track, with What's new written from
# the release's commits. The Release workflow starts it for each GitHub release
# it publishes, with its tag; it can also be run by hand. Until the app has been
# published once, Play takes releases as drafts only: then it uploads a draft,
# and says so. Promote moves a release between tracks; Play listing sends the
# store listing. Without the upload key it says so and stops.
#
# Secrets (Settings → Secrets and variables → Actions):
#   UPLOAD_KEYSTORE_BASE64    the upload keystore (.jks), base64
#   UPLOAD_KEYSTORE_PASSWORD  its password (and the key's, unless:)
#   UPLOAD_KEY_PASSWORD       the key's password, if it differs
#   UPLOAD_KEY_ALIAS          the key's alias, if not "upload"
#
# Variables (same page, Variables tab). To upload, keyless: GitHub's OIDC token
# is exchanged for the service account's (Workload Identity Federation), so
# there's no key to keep. Set up in Google Cloud project raineworks-play: the
# Play Android Developer API, the service account, a workload identity pool
# (github) with an OIDC provider for token.actions.githubusercontent.com that
# accepts only assertion.repository == 'raine-works/ha-googletv', and that
# repository's principalSet given Workload Identity User on the account. In the
# Play Console (Users and permissions) the account has, for Raineworks TV:
# Release to production and to testing tracks, Manage store presence, Manage
# policy declarations, and Edit and delete draft apps (needed for a listing
# while the app has never been published).
#   PLAY_SERVICE_ACCOUNT      the service account's email, invited in the Play
#                             Console with release permissions
#   PLAY_WORKLOAD_IDENTITY_PROVIDER  projects/<number>/locations/global/
#                             workloadIdentityPools/<pool>/providers/<provider>
# Optional:
#   PLAY_TRACK                the track: internal (default), alpha (closed
#                             testing), beta (open testing) or production
#   PLAY_RELEASE_STATUS       completed (default: rolled out at once) or draft
#                             (left for the Play Console)
#   PLAY_ROLLOUT              percent of users, for a staged rollout (100)
name: "Google Play"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag to build (v2.5.4); master when empty"
        required: false

permissions:
  contents: read
  # Signing in to Google Cloud without a key (Workload Identity Federation)
  id-token: write

jobs:
  bundle:
    name: Signed bundle
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ vars.PLAY_SERVICE_ACCOUNT != '' && vars.PLAY_WORKLOAD_IDENTITY_PROVIDER != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: No upload key yet
        if: env.HAS_KEY != 'true'
        working-directory: .
        run: |
          echo "::notice::No UPLOAD_KEYSTORE_BASE64 secret: no Google Play build."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          ref: ${{ inputs.tag || github.sha }}
          # The tags, for the commits since the last release (What's new)
          fetch-depth: 0

      - uses: actions/setup-java@v6
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        if: env.HAS_KEY == 'true'

      - name: Build the bundle
        if: env.HAS_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          export UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$UPLOAD_KEYSTORE"
          ./gradlew --no-daemon bundleRelease -Pplay
          rm -f "$UPLOAD_KEYSTORE"

      - uses: actions/upload-artifact@v7
        if: env.HAS_KEY == 'true'
        with:
          name: google-tv-by-raineworks-play
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Sign in to Google Cloud as the Play service account
        id: google
        if: env.HAS_KEY == 'true' && env.HAS_PLAY == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Release on Google Play
        if: env.HAS_KEY == 'true' && env.HAS_PLAY == 'true'
        working-directory: .
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          TAG: ${{ inputs.tag }}
        run: |
          # What's new: this release's commits since the one before
          head="${TAG:-HEAD}"
          previous=$(git describe --tags --abbrev=0 "$head^" 2>/dev/null || true)
          git log --format=%s ${previous:+"$previous.."}"$head" > "$RUNNER_TEMP/notes.txt"
          python3 scripts/play.py upload android/app/build/outputs/bundle/release/app-release.aab \
            --track "${{ vars.PLAY_TRACK || 'internal' }}" \
            --status "${{ vars.PLAY_RELEASE_STATUS || 'completed' }}" \
            --rollout "${{ vars.PLAY_ROLLOUT || '100' }}" \
            --notes "$RUNNER_TEMP/notes.txt" \
            ${TAG:+--name "${TAG#v}"}
