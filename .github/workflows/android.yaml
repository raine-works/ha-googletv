# Builds the TV app, Raineworks TV (android/), runs its unit tests and, on master, publishes the APK to
# the rolling "tv-bridge-dev" prerelease that the integration can install
# from for testing (googletv.install_tv_bridge with its URL). Pull requests'
# builds are signed with Android's debug key and get no secrets; a build of
# master (pushed, or run by hand on it) is signed with the release key, from the repository
# secrets the Release workflow lists, when they're set.
name: "TV app"

on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "custom_components/googletv/manifest.json"
      - ".github/workflows/android.yaml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yaml"
  workflow_dispatch:

# Read-only for the build, which runs a pull request's code; only `publish` (master only) may write.
permissions:
  contents: read

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Decode the release key (master only)
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No UPLOAD_KEYSTORE_BASE64 secret: the build is signed with the debug key."
          fi

      - name: Build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && secrets.UPLOAD_KEYSTORE_PASSWORD || '' }}
          RELEASE_KEY_PASSWORD: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && secrets.UPLOAD_KEY_PASSWORD || '' }}
          RELEASE_KEY_ALIAS: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && secrets.UPLOAD_KEY_ALIAS || '' }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease lintRelease

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Keep the APK, and its SHA-256 (Home Assistant checks it)
        run: |
          cp app/build/outputs/apk/release/app-release.apk raineworks-tv-bridge.apk
          sha256sum raineworks-tv-bridge.apk | cut -d' ' -f1 > raineworks-tv-bridge.apk.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raineworks-tv-bridge
          path: |
            android/raineworks-tv-bridge.apk
            android/raineworks-tv-bridge.apk.sha256

      - name: Lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore

  # The only job that writes: a build of master, never a pull request's. It runs none of the branch's code, only
  # `gh` on the APK the build uploaded.
  publish:
    name: Publish to tv-bridge-dev
    needs: build
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fetch the APK and its SHA-256
        run: gh run download "$GITHUB_RUN_ID" --name raineworks-tv-bridge --dir .
      - name: Publish to the tv-bridge-dev prerelease
        run: |
          if ! gh release view tv-bridge-dev >/dev/null 2>&1; then
            gh release create tv-bridge-dev --prerelease --target "$GITHUB_SHA" \
              --title "Raineworks TV: TV app (development build)" \
              --notes "The latest build of the TV app from master, for testing. Install it with the googletv.install_tv_bridge action and this release's APK URL."
          fi
          gh release upload tv-bridge-dev raineworks-tv-bridge.apk raineworks-tv-bridge.apk.sha256 --clobber
