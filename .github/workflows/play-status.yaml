# What Google Play has now, read only (scripts/play.py status): every track's
# releases and their status, and the store listing's images. Actions → Play
# status → Run workflow. Needs the same variables as the Google Play workflow.
name: "Play status"

on:
  workflow_dispatch:

permissions:
  contents: read
  # Signing in to Google Cloud without a key (Workload Identity Federation)
  id-token: write

jobs:
  status:
    name: Play status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sign in to Google Cloud as the Play service account
        id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Status
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 scripts/play.py status | tee -a "$GITHUB_STEP_SUMMARY"
