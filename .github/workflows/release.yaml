# Publishes a GitHub release when the manifest version changes on master.
# Runs only after the Test workflow passes, and only if the tag is new, so a
# push that doesn't bump the version is a no-op. The TV app attached to it is
# signed with the project's private release key, from these repository secrets
# (Settings → Secrets and variables → Actions); without the key it fails, and
# the release stays a draft:
#   UPLOAD_KEYSTORE_BASE64    the keystore (.jks), base64
#   UPLOAD_KEYSTORE_PASSWORD  its password (and the key's, unless:)
#   UPLOAD_KEY_PASSWORD       the key's password, if it differs
#   UPLOAD_KEY_ALIAS          the key's alias, if not "upload"
name: "Release"

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Create release for a new manifest version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(jq -r .version custom_components/googletv/manifest.json)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          # A draft until the TV app is attached: "latest" never lacks it
          gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes --draft
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The TV app, built from the same commit, attached to the
      # release (the integration installs it from there)
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.release.outputs.created == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.release.outputs.created == 'true'

      - name: Build and attach the TV app
        if: steps.release.outputs.created == 'true'
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::The UPLOAD_KEYSTORE_BASE64 secret isn't set: a release is signed with the release key."
            exit 1
          fi
          export RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RELEASE_KEYSTORE"
          cp app/build/outputs/apk/release/app-release.apk raineworks-tv-bridge.apk
          # Its SHA-256, which Home Assistant checks before installing it
          sha256sum raineworks-tv-bridge.apk | cut -d' ' -f1 > raineworks-tv-bridge.apk.sha256
          gh release upload "${{ steps.release.outputs.tag }}" \
            raineworks-tv-bridge.apk raineworks-tv-bridge.apk.sha256 --clobber
          gh release edit "${{ steps.release.outputs.tag }}" --draft=false --latest
