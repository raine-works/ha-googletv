# Publishes a GitHub release when the manifest version changes on master.
# Runs only after the Test workflow passes, and only if the tag is new, so a
# push that doesn't bump the version is a no-op.
name: "Release"

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  # Starting the Google Play workflow for the new release
  actions: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Create release for a new manifest version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(jq -r .version custom_components/googletv/manifest.json)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          # A draft until the TV app is attached: "latest" never lacks it
          gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes --draft
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The TV app, built from the same commit, attached to the
      # release (the integration installs it from there)
      - uses: actions/setup-java@v6
        if: steps.release.outputs.created == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        if: steps.release.outputs.created == 'true'

      - name: Build and attach the TV app
        if: steps.release.outputs.created == 'true'
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk raineworks-tv-bridge.apk
          # Its SHA-256, which Home Assistant checks before installing it
          sha256sum raineworks-tv-bridge.apk | cut -d' ' -f1 > raineworks-tv-bridge.apk.sha256
          gh release upload "${{ steps.release.outputs.tag }}" \
            raineworks-tv-bridge.apk raineworks-tv-bridge.apk.sha256 --clobber
          gh release edit "${{ steps.release.outputs.tag }}" --draft=false --latest

      # Google Play gets every release, and only releases: a run started by the
      # workflow's token is allowed by dispatch (not by release events)
      - name: Start the Google Play release
        if: steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run play.yaml --ref master -f tag="${{ steps.release.outputs.tag }}"
