# Publishes a GitHub release when the manifest version changes on master.
# Runs only after the Test workflow passes, and only if the tag is new, so a
# push that doesn't bump the version is a no-op.
name: "Release"

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Create release for a new manifest version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(jq -r .version custom_components/googletv/manifest.json)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

      # The TV app, built from the same commit, attached to the
      # release (the integration installs it from there)
      - uses: actions/setup-java@v4
        if: steps.release.outputs.created == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.release.outputs.created == 'true'

      - name: Build and attach the TV app
        if: steps.release.outputs.created == 'true'
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk raineworks-tv-bridge.apk
          version=$(jq -r .version ../custom_components/googletv/manifest.json)
          gh release upload "v${version}" raineworks-tv-bridge.apk --clobber
